<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="1erstyle.css" />
    <title>سنة ثانية ثانوي</title>
  </head>
  <body>
    <div class="glow glow-a"></div>
    <div class="glow glow-b"></div>
    <div class="glow glow-c"></div>
    <div class="particles" id="particles"></div>
    <nav class="navbar">
      
      <div class="teacher">الأستاذ لعفيفي رائد</div>
      <a href="cours.html">رجوع<i class="fa-solid fa-arrow-right"></i></a>
    </nav>

    <section class="hero">
      <div class="rule"></div>
      <div class="eyebrow">سنة ثانية ثانوي</div>
      <h1>اختر الفصل</h1>
      <p>كل فصل يحتوي على الدروس والملخصات والتمارين الخاصة به</p>
    </section>

    <div class="flask-stage">
      <div class="flask">
        <svg viewBox="0 0 100 130">
          <path
            d="M35 8 H65 V45 L88 105 A10 10 0 0 1 78 120 H22 A10 10 0 0 1 12 105 L35 45 Z"
            fill="rgba(255,255,255,0.06)"
            stroke="#6FD07C"
            stroke-width="2.5"
          />
          <path
            d="M18 108 A10 10 0 0 0 22 120 H78 A10 10 0 0 0 82 108 L78 96 H22 Z"
            fill="#6FD07C"
            opacity="0.55"
          />
          <line
            x1="35"
            y1="8"
            x2="65"
            y2="8"
            stroke="#6FD07C"
            stroke-width="3"
            stroke-linecap="round"
          />
        </svg>
        <div
          class="bubble"
          style="
            width: 6px;
            height: 6px;
            left: 38px;
            bottom: 15px;
            animation-delay: 0.2s;
          "
        ></div>
        <div
          class="bubble"
          style="
            width: 7px;
            height: 7px;
            left: 48px;
            bottom: 20px;
            animation-delay: 1s;
          "
        ></div>
        <div
          class="bubble"
          style="
            width: 5px;
            height: 5px;
            left: 44px;
            bottom: 10px;
            animation-delay: 1.8s;
          "
        ></div>
      </div>
    </div>
    <div class="cards">
      <a href="fasl1-2eme.html" class="card">
        <div class="icon-box"><i class="fa-solid fa-1"></i></div>
        <h3>الفصل الأول</h3>
        <p>دروس، ملخصات وتمارين الفصل الأول</p>
        <span class="go">ادخل <i class="fa-solid fa-arrow-left"></i></span>
      </a>

      <a href="fasl2-2eme.html" class="card">
        <div class="icon-box"><i class="fa-solid fa-2"></i></div>
        <h3>الفصل الثاني</h3>
        <p>دروس، ملخصات وتمارين الفصل الثاني</p>
        <span class="go">ادخل <i class="fa-solid fa-arrow-left"></i></span>
      </a>

      <a href="fasl3-2eme.html" class="card">
        <div class="icon-box"><i class="fa-solid fa-3"></i></div>
        <h3>الفصل الثالث</h3>
        <p>دروس، ملخصات وتمارين الفصل الثالث</p>
        <span class="go">ادخل <i class="fa-solid fa-arrow-left"></i></span>
      </a>
    </div>

</html>
